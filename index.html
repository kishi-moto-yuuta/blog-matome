<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="まとめ帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>ブログまとめ帳</title>
<style>
:root{
  --bg:#f6f4f0;--card:#ffffff;--ink:#1e1d1b;--sub:#6e6a64;--line:#e3dfd8;
  --accent:#c2416b;--accent-ink:#fff;--accent-soft:#fbe8ef;--chip:#ebe8e2;
  --lv:#2f7d4f;--lv-soft:#e3f2e8;--pv:#5552c9;--pv-soft:#e8e8fb;--ot:#77736c;--ot-soft:#ecebe8;
  --danger:#b3261e;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141414;--card:#1f1f1f;--ink:#ecebe8;--sub:#a29e97;--line:#323232;
  --accent:#ec6f98;--accent-ink:#1a0d12;--accent-soft:#3a2430;--chip:#2a2a2a;
  --lv:#6cc995;--lv-soft:#1d3226;--pv:#a3a1ff;--pv-soft:#26264a;--ot:#a9a59e;--ot-soft:#2b2b2b;
  --danger:#ff8a80;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 110px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0;letter-spacing:.02em}
.note{font-size:12px;color:var(--sub);text-align:right}
.note.warn{color:var(--danger)}
.hbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:13px;color:var(--sub)}
.hright{display:flex;align-items:center;gap:8px}
.bk p{font-size:13px;color:var(--sub);margin:4px 0 0}
.bk textarea.in{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.search{margin-top:10px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid transparent;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip .n{color:var(--sub);font-size:12px;margin-left:4px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.on .n{color:inherit;opacity:.8}
.chip.add{background:transparent;border:1px dashed var(--sub);color:var(--sub)}
.seg{display:flex;gap:6px;padding-top:6px;flex-wrap:wrap}
.seg .chip{font-size:13px;padding:4px 10px}
.hact{display:flex;gap:8px;align-items:center;padding-top:8px;font-size:13px;color:var(--sub)}
.hact button{background:none;border:none;color:var(--accent);padding:2px 4px;font-size:13px}
.hact button.del{color:var(--danger)}
.list{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.site{font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px}
.site.livedoor{background:var(--lv-soft);color:var(--lv)}
.site.privatter{background:var(--pv-soft);color:var(--pv)}
.site.other{background:var(--ot-soft);color:var(--ot)}
.tag{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px}
.title{display:block;font-weight:600;font-size:16px;color:var(--ink);text-decoration:none;word-break:break-word}
.url{font-size:12px;color:var(--sub);word-break:break-all;margin-top:1px}
.pw{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.pw code{font-family:ui-monospace,Menlo,monospace;background:var(--chip);border-radius:6px;padding:2px 8px;user-select:all;-webkit-user-select:all;word-break:break-all}
.pw button{background:none;border:none;color:var(--accent);font-size:13px;padding:2px}
.memo{margin:8px 0 0;font-size:13px;color:var(--sub);white-space:pre-wrap;word-break:break-word}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:8px 14px;font-size:14px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.empty{text-align:center;color:var(--sub);padding:48px 12px;font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:6;border:none;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 20px;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
.sheet h2{font-size:17px;margin:0 0 12px}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
textarea.in{min-height:64px;resize:vertical}
.hint{font-size:12px;color:var(--danger);margin-top:4px;min-height:0}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.newh{display:flex;gap:6px;margin-top:8px}
.newh .in{flex:1}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.row .spacer{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#222;color:#fff;font-size:14px;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:20;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow"><h1>ブログまとめ帳</h1><div class="hright"><div class="note" id="note"></div><button class="hbtn" id="bkBtn">バックアップ</button></div></div>
    <input class="search" id="q" type="search" placeholder="タイトル・URL・メモで検索" autocomplete="off">
    <div class="chips" id="hchips"></div>
    <div class="hact" id="hact" hidden></div>
    <div class="seg" id="schips"></div>
  </header>
  <main class="list" id="list"></main>
</div>
<button class="fab" id="fab">＋ 追加</button>

<!-- 作品の追加・編集 -->
<div class="overlay" id="entrySheet">
  <form class="sheet" id="entryForm" autocomplete="off" novalidate>
    <h2 id="entryTitle">作品を追加</h2>
    <label class="f" for="fUrl">URL（必須）</label>
    <input class="in" id="fUrl" type="text" inputmode="url" placeholder="https://..." autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <div class="hint" id="dupHint"></div>
    <label class="f" for="fTitle">タイトル</label>
    <input class="in" id="fTitle" type="text" placeholder="空欄ならURLを表示">
    <label class="f" for="fSite">サイト</label>
    <select class="in" id="fSite">
      <option value="livedoor">ライブドアブログ</option>
      <option value="privatter">privatter+</option>
      <option value="other">その他</option>
    </select>
    <label class="f" for="fPw">パスワード（なければ空欄）</label>
    <input class="in" id="fPw" type="text" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label class="f">ヒロイン（複数選択可）</label>
    <div class="pick" id="fHeroines"></div>
    <div class="newh">
      <input class="in" id="fNewH" type="text" placeholder="新しいヒロイン名">
      <button type="button" class="btn" id="fNewHBtn">追加</button>
    </div>
    <label class="f" for="fMemo">メモ</label>
    <textarea class="in" id="fMemo"></textarea>
    <div class="row">
      <button type="button" class="btn danger" id="fDelete" hidden>削除</button>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" data-close>キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</div>

<!-- ヒロインの追加・名前変更 -->
<div class="overlay" id="heroSheet">
  <form class="sheet" id="heroForm" autocomplete="off">
    <h2 id="heroTitle">ヒロインを追加</h2>
    <label class="f" for="hName">名前</label>
    <input class="in" id="hName" type="text" required>
    <div class="hint" id="hHint"></div>
    <div class="row">
      <button type="button" class="btn ghost" data-close>キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</div>

<!-- 確認 -->
<div class="overlay" id="confirmSheet">
  <div class="sheet">
    <h2 id="cTitle"></h2>
    <p id="cBody" style="margin:0;font-size:14px;color:var(--sub)"></p>
    <div class="row">
      <button type="button" class="btn ghost" data-close>やめる</button>
      <button type="button" class="btn danger" id="cOk">削除する</button>
    </div>
  </div>
</div>

<!-- バックアップ -->
<div class="overlay" id="bkSheet">
  <div class="sheet bk">
    <h2>バックアップ</h2>
    <p>データはこのiPhoneの中だけに保存されています。機種変更やホーム画面のアイコン削除で消えるので、ときどきコピーしてメモアプリなどに貼って保管してください。</p>
    <div class="row" style="justify-content:flex-start"><button type="button" class="btn primary" id="bkCopy">全データをコピー</button></div>
    <textarea class="in" id="bkOut" readonly style="margin-top:8px"></textarea>
    <label class="f" for="bkIn" style="margin-top:20px">復元：保管しておいた内容を貼り付け</label>
    <textarea class="in" id="bkIn" placeholder="ここに貼り付け" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    <div class="hint" id="bkHint"></div>
    <p>今のデータは消さずに、貼り付けた内容を追加します（同じ作品は貼り付けた内容で上書き）。</p>
    <div class="row">
      <button type="button" class="btn ghost" data-close>閉じる</button>
      <button type="button" class="btn primary" id="bkRestore">復元する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var LS_KEY = "blog-matome-v1";
var SITES = { livedoor:"ライブドア", privatter:"privatter+", other:"その他" };

var state = { items:{}, loaded:false, mode:"init", fH:"all", fS:"all", q:"", shown:{} };

/* ---------- 保存先 ---------- */
function newId(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function lsLoad(){ try{ var r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : {}; }catch(e){ return {}; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state.items)); }catch(e){ setNote("保存できません", true); toast("保存できませんでした。プライベートブラウズでないか確認してください"); } }

function putItem(id, body){ state.items[id] = body; lsSave(); render(); return Promise.resolve(); }
function delItem(id){ delete state.items[id]; lsSave(); render(); return Promise.resolve(); }

function setNote(text, warn){ var n = $("#note"); n.textContent = text; n.className = "note" + (warn ? " warn" : ""); }

function lsAvailable(){ try{ var k = LS_KEY + "-t"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }catch(e){ return false; } }
function init(){
  state.mode = "local"; state.items = lsLoad(); state.loaded = true;
  if(lsAvailable()) setNote("この端末に保存"); else setNote("保存できません", true);
  // ブラウザにデータを消さないよう依頼（対応している場合のみ）
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
  render();
}

/* ---------- データ取得 ---------- */
function heroines(){
  return Object.keys(state.items).filter(function(id){ return state.items[id].kind === "heroine"; })
    .map(function(id){ return { id:id, name:state.items[id].name || "", createdAt:state.items[id].createdAt || 0 }; })
    .sort(function(a,b){ return a.name.localeCompare(b.name, "ja"); });
}
function entries(){
  return Object.keys(state.items).filter(function(id){ return state.items[id].kind === "entry"; })
    .map(function(id){ var v = state.items[id]; return Object.assign({ id:id }, v, { heroines:(v.heroines || []).slice() }); })
    .sort(function(a,b){ return (b.createdAt || 0) - (a.createdAt || 0); });
}
function liveHeroIds(e, hmap){ return e.heroines.filter(function(h){ return hmap[h]; }); }

/* ---------- ユーティリティ ---------- */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function normUrl(u){
  u = (u || "").trim(); if(!u) return "";
  if(!/^https?:\/\//i.test(u)) u = "https://" + u.replace(/^\/+/, "");
  try{ var p = new URL(u); if(p.protocol !== "http:" && p.protocol !== "https:") return ""; return p.href; }catch(e){ return ""; }
}
function detectSite(u){
  var h = ""; try{ h = new URL(u).hostname.toLowerCase(); }catch(e){}
  if(h.indexOf("privatter") >= 0) return "privatter";
  if(/livedoor|(^|\.)blog\.jp$|doorblog\.jp$|ldblog\.jp$/.test(h)) return "livedoor";
  return "other";
}
function shortUrl(u){ try{ var p = new URL(u), path = p.pathname === "/" ? "" : p.pathname; try{ path = decodeURIComponent(path); }catch(e){} return p.hostname + path; }catch(e){ return u; } }

var toastTimer = null;
function toast(msg){
  var t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function fallbackCopy(text){
  try{
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok = document.execCommand("copy"); ta.remove(); return ok;
  }catch(e){ return false; }
}
function copyText(text, entryId){
  var done = function(){ toast("パスワードをコピーしました"); };
  var fail = function(){
    if(fallbackCopy(text)){ done(); return; }
    if(entryId){ state.shown[entryId] = true; render(); }
    toast("自動コピーできませんでした。表示したパスワードを長押しでコピーしてください");
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fail); }
    else fail();
  }catch(e){ fail(); }
}

/* ---------- 描画 ---------- */
function render(){
  var hs = heroines(), es = entries();
  var hmap = {}; hs.forEach(function(h){ hmap[h.id] = h; });
  if(state.fH !== "all" && state.fH !== "none" && !hmap[state.fH]) state.fH = "all";

  // ヒロインチップ
  var countNone = es.filter(function(e){ return liveHeroIds(e, hmap).length === 0; }).length;
  var html = '<button class="chip' + (state.fH === "all" ? " on" : "") + '" data-h="all">すべて<span class="n">' + es.length + '</span></button>';
  hs.forEach(function(h){
    var n = es.filter(function(e){ return e.heroines.indexOf(h.id) >= 0; }).length;
    html += '<button class="chip' + (state.fH === h.id ? " on" : "") + '" data-h="' + esc(h.id) + '">' + esc(h.name) + '<span class="n">' + n + '</span></button>';
  });
  if(countNone) html += '<button class="chip' + (state.fH === "none" ? " on" : "") + '" data-h="none">未分類<span class="n">' + countNone + '</span></button>';
  html += '<button class="chip add" data-h="+">＋ ヒロイン</button>';
  $("#hchips").innerHTML = html;

  // 選択中ヒロインの操作
  var hact = $("#hact");
  if(hmap[state.fH]){
    hact.hidden = false;
    hact.innerHTML = '<span>「' + esc(hmap[state.fH].name) + '」</span><button data-ha="rename">名前を変更</button><button class="del" data-ha="delete">削除</button>';
  } else { hact.hidden = true; hact.innerHTML = ""; }

  // サイトフィルタ
  var sh = '<button class="chip' + (state.fS === "all" ? " on" : "") + '" data-s="all">全サイト</button>';
  Object.keys(SITES).forEach(function(k){ sh += '<button class="chip' + (state.fS === k ? " on" : "") + '" data-s="' + k + '">' + SITES[k] + '</button>'; });
  $("#schips").innerHTML = sh;

  // 一覧
  var q = state.q.trim().toLowerCase();
  var list = es.filter(function(e){
    var hids = liveHeroIds(e, hmap);
    if(state.fH === "none" && hids.length) return false;
    if(state.fH !== "all" && state.fH !== "none" && hids.indexOf(state.fH) < 0) return false;
    if(state.fS !== "all" && (e.site || "other") !== state.fS) return false;
    if(q){
      var hay = [e.title, e.url, e.memo].concat(hids.map(function(h){ return hmap[h].name; })).join(" ").toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  var out = "";
  if(!state.loaded){ out = '<div class="empty">読み込み中…</div>'; }
  else if(!es.length){ out = '<div class="empty">まだ作品がありません。<br>右下の「＋ 追加」からURLを登録してください。</div>'; }
  else if(!list.length){ out = '<div class="empty">条件に合う作品がありません。</div>'; }
  else list.forEach(function(e){
    var site = SITES[e.site] ? e.site : "other";
    var hids = liveHeroIds(e, hmap);
    var url = esc(e.url);
    var hasPw = !!e.password;
    out += '<article class="card" data-id="' + esc(e.id) + '">' +
      '<div class="top"><span class="site ' + site + '">' + SITES[site] + '</span>' +
      hids.map(function(h){ return '<span class="tag">' + esc(hmap[h].name) + '</span>'; }).join("") + '</div>' +
      '<a class="title" href="' + url + '" target="_blank" rel="noopener noreferrer" data-open>' + esc(e.title || shortUrl(e.url)) + '</a>' +
      (e.title ? '<div class="url">' + esc(shortUrl(e.url)) + '</div>' : "") +
      (hasPw ? '<div class="pw"><span>🔑</span><code>' + (state.shown[e.id] ? esc(e.password) : "••••••") + '</code><button data-act="toggle">' + (state.shown[e.id] ? "隠す" : "表示") + '</button></div>' : "") +
      (e.memo ? '<p class="memo">' + esc(e.memo) + '</p>' : "") +
      '<div class="actions">' +
        '<a class="btn primary" href="' + url + '" target="_blank" rel="noopener noreferrer" data-open>' + (hasPw ? "コピーして開く" : "開く") + '</a>' +
        (hasPw ? '<button class="btn" data-act="copy">コピー</button>' : "") +
        '<button class="btn ghost" data-act="edit">編集</button>' +
      '</div></article>';
  });
  $("#list").innerHTML = out;
}

/* ---------- シート ---------- */
function openSheet(id){ $(id).classList.add("show"); }
function closeSheet(el){ el.classList.remove("show"); }
document.querySelectorAll(".overlay").forEach(function(ov){
  ov.addEventListener("click", function(ev){
    if(ev.target === ov || ev.target.hasAttribute("data-close")) closeSheet(ov);
  });
});

var confirmCb = null;
function askConfirm(title, body, cb){ $("#cTitle").textContent = title; $("#cBody").textContent = body; confirmCb = cb; openSheet("#confirmSheet"); }
$("#cOk").addEventListener("click", function(){ closeSheet($("#confirmSheet")); if(confirmCb){ var f = confirmCb; confirmCb = null; f(); } });

/* 作品フォーム */
var editing = null, picked = [], siteTouched = false;
function renderPick(){
  var hs = heroines();
  $("#fHeroines").innerHTML = hs.length ? hs.map(function(h){
    return '<button type="button" class="chip' + (picked.indexOf(h.id) >= 0 ? " on" : "") + '" data-p="' + esc(h.id) + '">' + esc(h.name) + '</button>';
  }).join("") : '<span style="font-size:13px;color:var(--sub)">下の欄からヒロインを追加できます</span>';
}
function checkDup(){
  var u = normUrl($("#fUrl").value), hint = "";
  if(u){ var d = entries().filter(function(e){ return e.url === u && e.id !== editing; })[0];
    if(d) hint = "このURLは登録済みです：" + (d.title || shortUrl(d.url)); }
  $("#dupHint").textContent = hint;
}
function openEntry(id){
  editing = id || null; siteTouched = !!id;
  var e = id ? state.items[id] : null;
  $("#entryTitle").textContent = id ? "作品を編集" : "作品を追加";
  $("#fUrl").value = e ? e.url : "";
  $("#fTitle").value = e ? (e.title || "") : "";
  $("#fSite").value = e ? (e.site || "other") : "other";
  $("#fPw").value = e ? (e.password || "") : "";
  $("#fMemo").value = e ? (e.memo || "") : "";
  $("#fNewH").value = "";
  var hmap = {}; heroines().forEach(function(h){ hmap[h.id] = 1; });
  picked = e ? (e.heroines || []).filter(function(h){ return hmap[h]; }) : (hmap[state.fH] ? [state.fH] : []);
  $("#fDelete").hidden = !id;
  renderPick(); checkDup(); openSheet("#entrySheet");
}
$("#fUrl").addEventListener("input", function(){
  if(!siteTouched){ var u = normUrl(this.value); if(u) $("#fSite").value = detectSite(u); }
  checkDup();
});
$("#fSite").addEventListener("change", function(){ siteTouched = true; });
$("#fHeroines").addEventListener("click", function(ev){
  var b = ev.target.closest("[data-p]"); if(!b) return;
  var id = b.getAttribute("data-p"), i = picked.indexOf(id);
  if(i >= 0) picked.splice(i, 1); else picked.push(id);
  renderPick();
});
function addHeroine(name){
  name = (name || "").trim(); if(!name) return null;
  var ex = heroines().filter(function(h){ return h.name === name; })[0];
  if(ex) return ex.id;
  var id = newId("h_"); putItem(id, { kind:"heroine", name:name, createdAt:Date.now() }); return id;
}
$("#fNewHBtn").addEventListener("click", function(){
  var id = addHeroine($("#fNewH").value); if(!id) return;
  if(picked.indexOf(id) < 0) picked.push(id);
  $("#fNewH").value = ""; renderPick();
});
$("#fNewH").addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); $("#fNewHBtn").click(); } });
$("#entryForm").addEventListener("submit", function(ev){
  ev.preventDefault();
  var u = normUrl($("#fUrl").value);
  if(!u){ $("#dupHint").textContent = "URLの形が正しくありません"; return; }
  var old = editing ? state.items[editing] : null;
  var body = {
    kind:"entry", url:u, title:$("#fTitle").value.trim(), site:$("#fSite").value,
    password:$("#fPw").value, memo:$("#fMemo").value.trim(), heroines:picked.slice(),
    createdAt: old ? (old.createdAt || Date.now()) : Date.now()
  };
  putItem(editing || newId("e_"), body);
  closeSheet($("#entrySheet")); toast(editing ? "更新しました" : "追加しました");
});
$("#fDelete").addEventListener("click", function(){
  var id = editing; if(!id) return; var e = state.items[id];
  closeSheet($("#entrySheet"));
  askConfirm("この作品を削除しますか？", (e.title || shortUrl(e.url)) + " を一覧から消します。元に戻せません。", function(){ delItem(id); toast("削除しました"); });
});

/* ヒロインフォーム */
var heroEditing = null;
function openHero(id){
  heroEditing = id || null;
  $("#heroTitle").textContent = id ? "ヒロイン名を変更" : "ヒロインを追加";
  $("#hName").value = id ? state.items[id].name : ""; $("#hHint").textContent = "";
  openSheet("#heroSheet");
}
$("#heroForm").addEventListener("submit", function(ev){
  ev.preventDefault();
  var name = $("#hName").value.trim(); if(!name) return;
  var dup = heroines().filter(function(h){ return h.name === name && h.id !== heroEditing; })[0];
  if(dup){ $("#hHint").textContent = "同じ名前のヒロインがすでにあります"; return; }
  if(heroEditing){ var b = Object.assign({}, state.items[heroEditing], { name:name }); putItem(heroEditing, b); }
  else { var id = addHeroine(name); state.fH = id; render(); }
  closeSheet($("#heroSheet"));
});

/* ---------- 一覧の操作 ---------- */
$("#q").addEventListener("input", function(){ state.q = this.value; render(); });
$("#hchips").addEventListener("click", function(ev){
  var b = ev.target.closest("[data-h]"); if(!b) return;
  var h = b.getAttribute("data-h");
  if(h === "+"){ openHero(null); return; }
  state.fH = h; render();
});
$("#schips").addEventListener("click", function(ev){
  var b = ev.target.closest("[data-s]"); if(!b) return; state.fS = b.getAttribute("data-s"); render();
});
$("#hact").addEventListener("click", function(ev){
  var b = ev.target.closest("[data-ha]"); if(!b) return;
  var id = state.fH, h = state.items[id]; if(!h) return;
  if(b.getAttribute("data-ha") === "rename"){ openHero(id); return; }
  askConfirm("「" + h.name + "」を削除しますか？", "作品は消えません。このヒロインの分類だけが外れます。", async function(){
    var es = entries().filter(function(e){ return e.heroines.indexOf(id) >= 0; });
    state.fH = "all";
    await delItem(id);
    for(var i = 0; i < es.length; i++){
      var e = es[i], body = Object.assign({}, state.items[e.id] || {});
      if(!body.kind) continue;
      body.heroines = e.heroines.filter(function(x){ return x !== id; });
      await putItem(e.id, body);
    }
    toast("削除しました");
  });
});
$("#list").addEventListener("click", function(ev){
  var card = ev.target.closest(".card"); if(!card) return;
  var id = card.getAttribute("data-id"), e = state.items[id]; if(!e) return;
  if(ev.target.closest("[data-open]")){ if(e.password) copyText(e.password, id); return; }
  var b = ev.target.closest("[data-act]"); if(!b) return;
  var act = b.getAttribute("data-act");
  if(act === "toggle"){ state.shown[id] = !state.shown[id]; render(); }
  else if(act === "copy"){ copyText(e.password, id); }
  else if(act === "edit"){ openEntry(id); }
});
$("#fab").addEventListener("click", function(){ openEntry(null); });

/* ---------- バックアップ ---------- */
function exportText(){ return JSON.stringify({ app:"blog-matome", v:1, exportedAt:new Date().toISOString(), items:state.items }); }
$("#bkBtn").addEventListener("click", function(){
  $("#bkOut").value = exportText(); $("#bkIn").value = ""; $("#bkHint").textContent = "";
  openSheet("#bkSheet");
});
$("#bkCopy").addEventListener("click", function(){
  var text = exportText(); $("#bkOut").value = text;
  var done = function(){ toast("全データをコピーしました。メモアプリなどに貼って保管してください"); };
  var fail = function(){
    if(fallbackCopy(text)){ done(); return; }
    var o = $("#bkOut"); o.focus(); o.select();
    toast("自動コピーできませんでした。下の欄を長押しして全選択→コピーしてください");
  };
  try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail); else fail(); }catch(e){ fail(); }
});
$("#bkRestore").addEventListener("click", function(){
  var hint = $("#bkHint"), raw = $("#bkIn").value.trim(), data;
  if(!raw){ hint.textContent = "貼り付けた内容がありません"; return; }
  try{ data = JSON.parse(raw); }catch(e){ hint.textContent = "形式が正しくありません（コピーした内容を全部貼り付けてください）"; return; }
  var items = data && data.items;
  if(!items || typeof items !== "object" || Array.isArray(items)){ hint.textContent = "このまとめ帳のバックアップではないようです"; return; }
  var add = 0;
  Object.keys(items).forEach(function(id){
    var v = items[id];
    if(!v || typeof v !== "object" || !/^[eh]_[a-z0-9]+$/i.test(id)) return;
    if(v.kind === "heroine" && typeof v.name === "string" && v.name.trim()){
      state.items[id] = { kind:"heroine", name:v.name.trim(), createdAt:+v.createdAt || Date.now() }; add++;
    } else if(v.kind === "entry"){
      var u = normUrl(v.url); if(!u) return;
      state.items[id] = { kind:"entry", url:u, title:String(v.title || ""), site:SITES[v.site] ? v.site : detectSite(u),
        password:String(v.password || ""), memo:String(v.memo || ""),
        heroines:Array.isArray(v.heroines) ? v.heroines.filter(function(x){ return typeof x === "string"; }) : [],
        createdAt:+v.createdAt || Date.now() }; add++;
    }
  });
  if(!add){ hint.textContent = "復元できるデータが見つかりませんでした"; return; }
  lsSave(); render(); closeSheet($("#bkSheet")); toast(add + "件を復元しました");
});

init();
})();
</script>
</body>
</html>
